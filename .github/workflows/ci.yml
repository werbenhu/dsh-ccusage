name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Metadata consistency
        run: |
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (pkg.name !== "dsh-ccusage") throw new Error("unexpected package name: " + pkg.name);
            if (!pkg.version) throw new Error("missing version");
            for (const file of readdirSync("locale")) {
              const locale = JSON.parse(readFileSync("locale/" + file, "utf8"));
              if (locale.version && locale.version !== pkg.version) {
                throw new Error(file + " version " + locale.version + " != package.json " + pkg.version);
              }
            }
            console.log("package " + pkg.name + "@" + pkg.version);
          '

      - name: Syntax check
        run: |
          set -eu
          node --check index.js
          node --check client.js
          find src -name '*.js' -print0 | xargs -0 -r -n1 node --check
          find test -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          find scripts -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Run tests
        run: node --test test/*.test.mjs

      - name: Package dry-run
        if: matrix.node == '22'
        run: npm pack --dry-run
