name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0); leave empty to use package.json version'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version
        id: version
        run: |
          set -eu
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${PKG_VERSION}"
          fi
          if [ "$TAG" != "v${PKG_VERSION}" ]; then
            echo "::error::tag $TAG does not match package.json version v${PKG_VERSION}"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG"

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          for file in src/*.js src/sources/*.js; do node --check "$file"; done

      - name: Run tests
        run: node --test test/*.test.mjs

      - name: Pack
        id: pack
        run: |
          set -eu
          # npm pack 不会自己创建 --pack-destination，缺目录会直接 ENOENT（exit 254）。
          mkdir -p dist
          npm pack --pack-destination dist
          ASSET=$(ls dist/*.tgz | head -n 1)
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Checksums
        run: |
          set -eu
          cd dist
          sha256sum ./*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ccusage-${{ steps.version.outputs.tag }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: dsh-ccusage ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tgz
            dist/SHA256SUMS.txt