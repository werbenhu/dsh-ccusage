# 注册 ccusage 用量分析插件。
#
# Host 侧读取 Claude Code（~/.claude/projects）、Codex（~/.codex/sessions）和
# OpenCode（~/.local/share/opencode/storage/message）的本地会话记录，按
# ccusage 的算法聚合 token 用量，通过同源路由
# /api/dsh-ccusage/* 提供给前端。
#
# 所有配置项都有内置默认值。要调整时，在 profile 的 cordis.patch.yml 里加：
#
#   - id: ccusage
#     config:
#       timezone: Asia/Shanghai   # 默认跟随系统
#       sources: [claude, codex, opencode]
#       cacheMs: 20000            # 扫描结果缓存，毫秒
#       weekStart: monday         # monday | sunday
#       claudeDirs: []            # 覆盖默认的 ~/.claude
#       codexDirs: []
#       opencodeDirs: []
- insert:
    - id: ccusage
      name: dsh-ccusage
